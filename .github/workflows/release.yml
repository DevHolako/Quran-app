name: Build & Auto-Update Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Executables
        run: npm run dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-artifacts
          path: |
            dist/*.exe
            version.json

  deploy-drive-and-release:
    name: Upload to Google Drive & GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: quran-app-artifacts
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            version.json
          generate_release_notes: true

      - name: Upload Setup Installer to Google Drive
        if: env.GDRIVE_CREDENTIALS != ''
        uses: adityak74/google-drive-upload-git-action@main
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: 'dist/Quran_App_Setup_*.exe'
          folderId: '1FPlrhNXbhK48Cwor-PLCC5sPUZb6sZL0'
          overwrite: 'true'

      - name: Upload version.json to Google Drive
        if: env.GDRIVE_CREDENTIALS != ''
        uses: adityak74/google-drive-upload-git-action@main
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: 'version.json'
          folderId: '1FPlrhNXbhK48Cwor-PLCC5sPUZb6sZL0'
          overwrite: 'true'
